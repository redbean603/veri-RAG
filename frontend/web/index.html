<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veri-RAG · Graph RAG Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">

    <!-- Logo -->
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="6"  r="3" fill="currentColor"/>
            <circle cx="5"  cy="18" r="3" fill="currentColor" opacity=".7"/>
            <circle cx="19" cy="18" r="3" fill="currentColor" opacity=".7"/>
            <line x1="12" y1="9"  x2="5"  y2="15" stroke="currentColor" stroke-width="1.5"/>
            <line x1="12" y1="9"  x2="19" y2="15" stroke="currentColor" stroke-width="1.5"/>
            <line x1="8"  y1="18" x2="16" y2="18" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </div>
        <span class="logo-name">Veri-RAG</span>
      </div>
      <button class="icon-btn sidebar-collapse-btn" onclick="toggleSidebar()" title="Collapse sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.4"/>
          <path d="M6 1v14" stroke="currentColor" stroke-width="1.4"/>
          <path d="M9 6l-2 2 2 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- New Chat -->
    <button class="btn-new-chat" onclick="createNewChat()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      New chat
    </button>

    <!-- Search -->
    <div class="sidebar-search">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" placeholder="Search" id="searchInput" oninput="filterChats(this.value)" />
      <span class="search-shortcut">⌘K</span>
    </div>

    <!-- Divider -->
    <div class="sidebar-divider"></div>

    <!-- Chat History -->
    <div class="sidebar-history">
      <div class="history-group" id="historyToday" style="display:none">
        <span class="history-label">Today</span>
        <ul class="chat-list" id="chatListToday"></ul>
      </div>
      <div class="history-group" id="historyYesterday" style="display:none">
        <span class="history-label">Yesterday</span>
        <ul class="chat-list" id="chatListYesterday"></ul>
      </div>
      <div class="history-group" id="historyOlder" style="display:none">
        <span class="history-label">7 days</span>
        <ul class="chat-list" id="chatListOlder"></ul>
      </div>
      <p class="history-empty" id="historyEmpty">No chats yet</p>
    </div>

  </aside>

  <!-- ══════════════════════════════════════
       WORKSPACE
  ══════════════════════════════════════ -->
  <main class="workspace" id="workspace">

    <!-- Top Bar -->
    <header class="topbar">
      <!-- Left: sidebar toggle + model label -->
      <div class="topbar-left">
        <button class="icon-btn" id="sidebarOpenBtn" onclick="toggleSidebar()" title="Open sidebar" style="display:none">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="1" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.4"/>
            <path d="M6 1v14" stroke="currentColor" stroke-width="1.4"/>
            <path d="M9 6l2 2-2 2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="model-pill" id="modelPill">
          <div class="model-pill-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="6"  r="3" fill="currentColor"/>
              <circle cx="5"  cy="18" r="3" fill="currentColor" opacity=".6"/>
              <circle cx="19" cy="18" r="3" fill="currentColor" opacity=".6"/>
              <line x1="12" y1="9" x2="5"  y2="15" stroke="currentColor" stroke-width="1.5"/>
              <line x1="12" y1="9" x2="19" y2="15" stroke="currentColor" stroke-width="1.5"/>
              <line x1="8"  y1="18" x2="16" y2="18" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </div>
          Veri-RAG
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="margin-left:2px;opacity:.5">
            <path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Right: actions -->
      <div class="topbar-right">
        <button class="icon-btn" title="More options">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="3"  cy="8" r="1.2" fill="currentColor"/>
            <circle cx="8"  cy="8" r="1.2" fill="currentColor"/>
            <circle cx="13" cy="8" r="1.2" fill="currentColor"/>
          </svg>
        </button>
        <button class="icon-btn" title="Share" onclick="exportChat()">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M11 5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM5 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM11 15a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" stroke="currentColor" stroke-width="1.4"/>
            <path d="M7 6.5l2-1M7 9.5l2 1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="btn-export" onclick="exportChat()">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
            <path d="M8 1v9M5 7l3 3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12v2h12v-2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          Export chat
        </button>
        <!-- API status -->
        <div class="api-badge" id="apiBadge" title="API status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusLabel">…</span>
        </div>
      </div>
    </header>

    <!-- Scrollable content -->
    <div class="workspace-content" id="workspaceContent">

      <!-- Welcome (shown when no messages) -->
      <section class="welcome" id="welcomeSection">
        <!-- Orb -->
        <div class="orb-wrap">
          <div class="orb"></div>
        </div>

        <p class="welcome-greeting">Veri-RAG</p>
        <h2 class="welcome-question">뉴스 URL로 그래프를 탐색하세요</h2>

        <!-- Input (welcome mode — centered) -->
        <div class="input-card" id="inputCardWelcome">
          <textarea
            id="queryInputWelcome"
            class="query-textarea"
            placeholder="뉴스 URL을 입력하세요... (예: https://news.example.com/article)"
            rows="1"
            onkeydown="handleKeydown(event, 'welcome')"
            oninput="syncInputs('welcome')"
          ></textarea>
          <div class="input-actions">
            <div class="input-right-actions" style="margin-left:auto">
              <button class="btn-send" id="btnSendWelcome" onclick="sendQuery()" title="Send">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                  <path d="M2 14L14 8 2 2v5l8 1-8 1v5z" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Messages (shown after first query) -->
      <div class="messages" id="messages"></div>

    </div>

    <!-- Input bar (pinned bottom — chat mode) -->
    <div class="input-bar" id="inputBarBottom" style="display:none">
      <div class="input-card" id="inputCardBottom">
        <textarea
          id="queryInputBottom"
          class="query-textarea"
          placeholder="뉴스 URL을 입력하세요... (예: https://news.example.com/article)"
          rows="1"
          onkeydown="handleKeydown(event, 'bottom')"
          oninput="syncInputs('bottom')"
        ></textarea>
        <div class="input-actions">
          <div class="input-right-actions" style="margin-left:auto">
            <button class="btn-send" id="btnSendBottom" onclick="sendQuery()" title="Send">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <path d="M2 14L14 8 2 2v5l8 1-8 1v5z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <p class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for newline</p>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
